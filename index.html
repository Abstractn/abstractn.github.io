<!doctype html>
<html lang="en">
  <head>
    <script id="redirect-guard">
      (() => {
        const originPathName = '/abs-webtools/';
        const targetPathName = '/abs-webtools/dist/';
        const currentPathName = window.location.pathname;
        if(currentPathName === originPathName) {
          window.location = targetPathName;
        }
      })();
    </script>
  
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="256x256" href="favicon.ico">
    <script src="https://kit.fontawesome.com/e97eac13ba.js" crossorigin="anonymous"></script>
    <title>Abstractn</title>
  </head>
  {{> main }}
</html>
